name: Play Lab isolated browser smoke test
on:
  push:
    branches: [feature/playlab-animation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve isolated development site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bb-server.log 2>&1 &
          sleep 2
      - name: Run desktop and mobile emulation smoke tests
        run: node tests/playlab-browser-smoke.cjs
